<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Somali Weather System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/config.local.js"></script>
    <script defer src="js/main.js"></script>
</head>
<body>
    <div id="toastContainer"></div>

    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-cloud-sun"></i></div>
                <h1>Weather for Somali Cities</h1>
            </div>
            <div class="flags">
                <img src="images/Flag_of_Somalia.svg.png" alt="Somalia">
                <img src="images/Flag_of_Somaliland.svg.png" alt="Somaliland">
                <img src="images/Flag_of_Puntland.svg.png" alt="Puntland">
                <img src="images/Flag_of_Jubaland_(Somalia).svg.png" alt="Jubaland">
            </div>
        </div>
    </header>

    <nav class="navbar">
        <button class="hamburger" id="hamburgerBtn" aria-label="Menu">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li class="nav-auth" id="navAuth">
                <a href="log-in.html"><button class="btn-login">Log In</button></a>
                <a href="sign-up.html"><button class="btn-signup active-btn">Sign Up</button></a>
                <span id="userDisplay" class="user-display" style="display:none">
                    <i class="fas fa-user-circle"></i> <span id="userName"></span>
                    <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
                </span>
            </li>
        </ul>
    </nav>

    <main>
        <section class="form-section">
            <div class="form-card">
                <div class="form-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>Create Account</h2>
                <p class="form-subtitle">Join the Somali Weather community</p>
                <form id="signupForm" novalidate>
                    <div class="form-group">
                        <label for="username"><i class="fas fa-user"></i> Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose a username" required>
                        <span class="error-message" id="usernameError"></span>
                    </div>
                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="email" name="email" placeholder="your@email.com" required>
                        <span class="error-message" id="emailError"></span>
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-container">
                            <input type="password" id="password" name="password" placeholder="Create a password" required>
                            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                        <div class="password-container">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                            <i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
                        </div>
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>
                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                            <span class="checkmark"></span>
                            I agree to the <a href="#">Terms of Service</a>
                        </label>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-user-plus"></i> Sign Up
                    </button>
                </form>
                <p class="form-footer">Already have an account? <a href="log-in.html">Log In</a></p>
            </div>
        </section>
    </main>

    <footer>
        <div class="flags">
            <img src="images/Flag_of_South_West_State_of_Somalia.svg.png" alt="Southwest">
            <img src="images/Flag_of_Ogaden_National_Liberation_Front(2).svg.png" alt="Ogadenia">
            <img src="images/Flag_of_Galmudug.svg.png" alt="Galmudug">
            <img src="images/Flag_of_Khaatumo_State_of_Somalia.svg.png" alt="Khatumo">
        </div>
        <p>Follow us on:</p>
        <div class="social-media">
            <a href="https://www.facebook.com" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://www.twitter.com" target="_blank" aria-label="Twitter"><i class="fa-brands fa-square-x-twitter"></i></a>
            <a href="https://www.instagram.com" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </div>
        <p>For more information about Somali weather, visit <a href="https://www.google.com/search?q=somali+weather">Google</a>.</p>
        <p>&copy; 2025 Somali Weather System</p>
    </footer>
</body>
</html>
