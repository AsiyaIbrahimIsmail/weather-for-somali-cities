<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somali Weather System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/config.local.js"></script>
    <script defer src="js/main.js"></script>
</head>
<body>
    <div id="toastContainer"></div>

    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-cloud-sun"></i></div>
                <h1>Weather for Somali Cities</h1>
            </div>
            <div class="flags">
                <img src="images/Flag_of_Somalia.svg.png" alt="Somalia">
                <img src="images/Flag_of_Somaliland.svg.png" alt="Somaliland">
                <img src="images/Flag_of_Puntland.svg.png" alt="Puntland">
                <img src="images/Flag_of_Jubaland_(Somalia).svg.png" alt="Jubaland">
            </div>
        </div>
    </header>

    <nav class="navbar">
        <button class="hamburger" id="hamburgerBtn" aria-label="Menu">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html" class="active">Home</a></li>
            <li class="nav-auth" id="navAuth">
                <a href="log-in.html"><button class="btn-login" id="loginNavBtn">Log In</button></a>
                <a href="sign-up.html"><button class="btn-signup" id="signupNavBtn">Sign Up</button></a>
                <span id="userDisplay" class="user-display" style="display:none">
                    <i class="fas fa-user-circle"></i> <span id="userName"></span>
                    <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i></button>
                </span>
            </li>
        </ul>
    </nav>

    <main>
        <section class="weather">
            <div class="weather-hero">
                <div class="weather-header">
                    <div class="weather-header-left">
                        <h2>Somali Weather</h2>
                        <p>Real-time data for major cities</p>
                    </div>
                    <div class="weather-actions">
                        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                            <i class="fas fa-moon"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="weather-controls">
                <div class="select-wrapper">
                    <i class="fas fa-map-marker-alt"></i>
                    <select id="city">
                        <option value="Mogadishu">Mogadishu</option>
                        <option value="Hargeisa">Hargeisa</option>
                        <option value="Kismayo">Kismayo</option>
                        <option value="Baidoa">Baidoa</option>
                        <option value="Garowe">Garowe</option>
                        <option value="Dusa Marreb">Dhusamareb</option>
                        <option value="Beledweyne">Beledweyne</option>
                        <option value="Jijiga">Jijiga</option>
                    </select>
                </div>
                <button id="btn-getting-weather" onclick="getWeather()" class="btn-primary">
                    <i class="fas fa-cloud-sun"></i> Get Weather
                </button>
                <button id="btn-forecast" onclick="getWeatherForecast()" class="btn-secondary">
                    <i class="fas fa-calendar-week"></i> 5-Day Forecast
                </button>
            </div>
            <div class="weather-details" id="weatherDetails">
                <div class="weather-placeholder">
                    <i class="fas fa-cloud-sun fa-4x"></i>
                    <p>Select a city and click <strong>Get Weather</strong></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="flags">
            <img src="images/Flag_of_South_West_State_of_Somalia.svg.png" alt="Southwest">
            <img src="images/Flag_of_Ogaden_National_Liberation_Front(2).svg.png" alt="Ogadenia">
            <img src="images/Flag_of_Galmudug.svg.png" alt="Galmudug">
            <img src="images/Flag_of_Khaatumo_State_of_Somalia.svg.png" alt="Khatumo">
        </div>
        <p>Follow us on:</p>
        <div class="social-media">
            <a href="https://www.facebook.com" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://www.twitter.com" target="_blank" aria-label="Twitter" onclick="shareWeather()"><i class="fa-brands fa-square-x-twitter"></i></a>
            <a href="https://www.instagram.com" target="_blank" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </div>
        <p>For more information about Somali weather, visit <a href="https://www.google.com/search?q=somali+weather">Google</a>.</p>
        <p>&copy; 2025 Somali Weather System</p>
    </footer>

    <button id="backToTop" class="back-to-top" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>
</body>
</html>
